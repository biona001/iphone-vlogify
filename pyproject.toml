[project]
name = "iphone-vlogify"
version = "0.1.0"
description = "Automatically generate vlog captions from iPhone photos and videos"
authors = [{name="Benjamin Chu", email="benchu99@hotmail.com"}]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "geopy",
    "moviepy",
    "PyExifTool",
    "exifread",
    "ffmpeg-python",
    "Pillow",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
vlogify = "vlogify.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
